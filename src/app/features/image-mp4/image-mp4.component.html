
<div class="table-container">

  <!-- Top controls -->
  <div class="controls">
    <button (click)="prev()">⬅ Previous</button>
    <button (click)="next()">Next ➡</button>
  </div>

  <table class="image-table">

    <tr *ngFor="let row of getRows(); let rowIndex = index">

      <td *ngFor="let item of row; let colIndex = index">

        <div class="media-wrapper">

          <!-- IMAGE -->
          <img
            *ngIf="item.type === 'image'"
            [src]="item.src"
            alt=""
          />

          <!-- VIDEO / AUDIO -->
          <ng-container *ngIf="item.type !== 'image'">

            <!-- Placeholder -->
            <img
              *ngIf="playingIndex !== rowIndex * 2 + colIndex"
              [src]="item.placeholder"
              alt=""
              class="clickable"
              (click)="playMedia(rowIndex * 2 + colIndex)"
            />

            <!-- Audio -->
            <audio
              *ngIf="
                item.type === 'audio' &&
                playingIndex === rowIndex * 2 + colIndex
              "
              controls
              autoplay
            >
              <source
                [src]="item.src"
                type="audio/mpeg"
              />
            </audio>

          </ng-container>

        </div>

      </td>

    </tr>

  </table>

  <!-- Bottom controls -->
  <div class="controls">
    <button (click)="prev()">⬅ Previous</button>
    <button (click)="next()">Next ➡</button>
  </div>

</div>


<!-- ================================================= -->
<!-- FULL SCREEN VIDEO OVERLAY                         -->
<!-- ================================================= -->

<div
  class="fullscreen-overlay"
  *ngIf="fullscreenVideo"
  (click)="closeFullscreenVideo()"
>

  <button
    class="close-button"
    (click)="closeFullscreenVideo(); $event.stopPropagation()"
  >

  </button>

  <video
    class="fullscreen-video"
    controls
    autoplay
    playsinline
    (click)="$event.stopPropagation()"
  >

    <source
      [src]="fullscreenVideo.src"
      type="video/mp4"
    />

    Your browser does not support HTML5 video.

  </video>

</div>
